name: Build

on:
  push:
    branches: ['feat/**']
    paths-ignore: ['*.md']
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s upstream/tests -v
  build:
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
